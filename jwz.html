<!doctype html>

    <title>jwz</title>
    <link rel="stylesheet" href="tongyong.css" />
    <style>
      /* content box */
      .cb {
        height: 200px;
        margin-top: 5px;
        margin-left: 5px;
        margin-right: 5px;
      }
      .yincang {
        display: none;
      }
      .fw {
        background-color: red;
        width: 200px;
        height: 100px;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .fwflex {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body class="flex column" onload="floatwindow()">
    <!-- floatwindow -->
    <div id="fw" class="fw">
      <h1 style="margin: 0; font-size: 20px">Welcome to JWZ</h1>
      <p style="margin: 0">You can find anything in there</p>
      <button id="closefw">x</button>
    </div>
    <script>
      var fw = document.getElementById("fw");
      var cfw = document.getElementById("closefw");
      cfw.addEventListener("click", function () {
        fw.classList.add("yincang");
      });
    </script>
    <!-- top label -->
